<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TipJar Cyber Club</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <!-- PROFILE PHOTO -->

    <div class="profile-container">

        <img
            id="profilePic"
            class="profile-pic"
            src=""
            alt="Profile Picture">

    </div>

    <!-- STATUS -->

    <div
        class="status"
        id="status">

        OFFLINE

    </div>

    <!-- ROLE -->

    <div
        class="role"
        id="role">

        AVAILABLE

    </div>

    <!-- AVATAR NAME -->

    <div
        class="name"
        id="name">

        CLICK TO LOGIN

    </div>

    <!-- TIPS LABEL -->

    <div class="tips-label">

        SESSION TIPS

    </div>

    <!-- TOTAL TIPS -->

    <div
        class="tips"
        id="tips">

        L$ 0

    </div>

    <!-- THANK YOU MESSAGE -->

    <div class="thanks">

        Thank You For Supporting
        <br>
        Our Venue ♥

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
